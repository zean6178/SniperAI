<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SniperAI — Light Mode Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif;background:#eef0f5;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:40px 20px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.phone{width:390px;min-height:844px;border-radius:48px;background:#fff;box-shadow:0 40px 100px rgba(0,0,0,0.15),0 0 0 1px rgba(0,0,0,0.06);overflow:hidden;position:relative;display:flex;flex-direction:column}
.phone-label{text-align:center;color:#0066FF;font-size:13px;font-weight:600;margin-top:14px;letter-spacing:1.5px;text-transform:uppercase}

/* Black Hole - Light */
.bh-container{display:flex;justify-content:center;padding-top:60px;padding-bottom:10px;background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(100,160,255,0.12) 0%,transparent 70%)}
.bh-wrap{position:relative;width:280px;height:260px;display:flex;align-items:center;justify-content:center}
.bh-outer-glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(ellipse,transparent 38%,rgba(0,120,255,0.06) 55%,rgba(0,180,255,0.03) 70%,transparent 85%);animation:spin 18s linear infinite}
.bh-particle-ring{position:absolute;width:240px;height:240px;border-radius:50%;border:1px solid rgba(0,150,255,0.08);animation:spin 25s linear infinite reverse;box-shadow:0 0 20px rgba(0,120,255,0.07)}
.bh-accretion{position:absolute;width:195px;height:195px;border-radius:50%;background:conic-gradient(from 180deg,transparent 0%,rgba(0,120,255,0.4) 20%,rgba(0,180,255,0.7) 35%,rgba(30,120,255,0.5) 50%,transparent 60%,rgba(0,80,255,0.2) 75%,rgba(0,150,255,0.35) 85%,transparent 100%);filter:blur(3px);animation:spin 6s linear infinite}
.bh-inner-glow{position:absolute;width:185px;height:185px;border-radius:50%;background:radial-gradient(ellipse,transparent 45%,rgba(0,120,255,0.35) 58%,rgba(0,180,255,0.6) 65%,rgba(0,120,255,0.3) 72%,transparent 80%);filter:blur(2px);animation:spin 4s linear infinite reverse}
.bh-arc{position:absolute;width:170px;height:170px;border-radius:50%;background:transparent;box-shadow:0 -2px 16px 3px rgba(0,160,255,0.7),0 -1px 6px 2px rgba(60,180,255,0.8);animation:pulse 3s ease-in-out infinite}
.bh-core{position:absolute;width:130px;height:130px;border-radius:50%;background:#000;box-shadow:0 0 0 2px rgba(0,120,255,0.1),0 0 20px rgba(0,0,0,0.3);z-index:10}

/* Content */
.content{flex:1;padding:8px 28px 0;display:flex;flex-direction:column;gap:16px}
.title{font-size:52px;font-weight:800;color:#0a0a1a;letter-spacing:-1.5px;line-height:1;text-align:center;margin:0}
.btn-primary{width:100%;padding:18px 24px;border-radius:16px;border:none;background:linear-gradient(135deg,#1a6fff 0%,#2291ff 100%);color:#fff;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,100,255,0.35);letter-spacing:.1px}
.btn-secondary{width:100%;padding:18px 24px;border-radius:16px;border:1.5px solid rgba(0,0,0,0.10);background:rgba(255,255,255,0.9);color:#0a0a1a;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,0.06);letter-spacing:.1px}
.btn-left{display:flex;align-items:center;gap:12px}

/* Bottom Nav */
.nav{margin-top:auto;padding:16px 0 28px;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,0.06);display:flex;justify-content:space-around;align-items:flex-end}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(0,0,0,0.4);min-width:52px;cursor:pointer}
.nav-item span{font-size:11px;font-weight:500;letter-spacing:.2px}
.nav-center{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#0066ff,#00ccff);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(0,150,255,0.15),0 8px 24px rgba(0,120,255,0.5);margin-bottom:2px;cursor:pointer}
</style>
</head>
<body>

<div>
<div class="phone">
  <!-- Black Hole Hero -->
  <div class="bh-container">
    <div class="bh-wrap">
      <div class="bh-outer-glow"></div>
      <div class="bh-particle-ring"></div>
      <div class="bh-accretion"></div>
      <div class="bh-inner-glow"></div>
      <div class="bh-arc"></div>
      <div class="bh-core"></div>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <h1 class="title">Sniper</h1>

    <div class="btn-primary">
      <div class="btn-left">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="2"/></svg>
        <span>Connect Seed Vault</span>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,18 15,12 9,6"/></svg>
    </div>

    <div class="btn-secondary">
      <div class="btn-left">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M16 10h2a2 2 0 0 1 0 4h-2v-4z"/><path d="M2 10h4"/></svg>
        <span>Connect wallet</span>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,18 15,12 9,6"/></svg>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="nav">
    <div class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24,7.76 14.12,14.12 7.76,16.24 9.88,9.88"/></svg>
      <span>Discover</span>
    </div>
    <div class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2l2 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z"/><circle cx="18" cy="5" r="1.5" fill="currentColor"/></svg>
      <span>AI</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div class="nav-center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="2" fill="white"/></svg>
      </div>
    </div>
    <div class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
      <span>History</span>
    </div>
    <div class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span>Profile</span>
    </div>
  </div>
</div>
<div class="phone-label">SniperAI — Light Mode</div>
</div>

</body>
</html>
